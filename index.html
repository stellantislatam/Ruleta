<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Logistica | Stellantis</title>
<style>
:root{--navy:#102a43;--blue:#1464a5;--cyan:#21b6c7;--gold:#ffca3a;--bg:#f2f6fb;--ink:#183047}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#e4f4fb,#f4f6fb 55%,#e8eef6);font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh}
header{background:linear-gradient(110deg,#102a43,#145b91);color:white;padding:20px 5vw;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 5px 18px #102a4325}
.brand{font-weight:900;letter-spacing:1px;font-size:clamp(18px,3vw,25px)}.brand span{color:#5ee2e7}.tag{font-size:12px;opacity:.85;text-align:right}
main{max-width:980px;margin:30px auto;padding:0 18px 40px}
.panel{background:white;border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 14px 40px #18304715;border:1px solid #e4ebf2}
h1{font-size:clamp(27px,5vw,42px);margin:0 0 10px;color:var(--navy)}.sub{color:#61788d;line-height:1.5;margin:0 0 24px}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px}
.cat{border:0;border-radius:16px;padding:17px;color:white;text-align:left;cursor:pointer;min-height:88px;transition:.18s;box-shadow:0 5px 12px #102a4318}
.cat:hover{transform:translateY(-3px);filter:brightness(1.06)}.cat strong{display:block;font-size:17px;margin-bottom:5px}.cat small{opacity:.9}
.all{background:linear-gradient(120deg,#102a43,#2377b9);grid-column:1/-1;min-height:65px}
.safety{background:#e34e58}.aperturado{background:#805ad5}.criticos{background:#e88b27}.recepcion{background:#169c91}.cuenta{background:#3378c8}.abassamento{background:#b34d91}.sistema{background:#60758c}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pill{background:#eaf3fa;color:#17517e;padding:8px 13px;border-radius:99px;font-weight:700;font-size:13px}
.score{font-weight:800;color:#176d61}.progress{height:9px;background:#e9eff5;border-radius:99px;overflow:hidden;margin:12px 0 26px}.bar{height:100%;background:linear-gradient(90deg,#20b6c7,#1464a5);width:0%;transition:width .25s}
.qnum{font-size:13px;color:#7890a4;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.question{font-size:clamp(21px,3.5vw,29px);line-height:1.3;color:#102a43;margin:12px 0 24px;font-weight:800}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{border:2px solid #e1eaf2;background:#fff;border-radius:14px;padding:16px;text-align:left;font-size:16px;line-height:1.35;color:#24445e;cursor:pointer;min-height:75px;transition:.15s}
.answer:hover:not(:disabled){border-color:#2999c5;background:#f4fbff}.answer:disabled{cursor:default}
.answer.correct{border-color:#1b9b68;background:#e9f8f1;color:#126344;font-weight:700}
.answer.wrong{border-color:#dc5962;background:#fff0f0;color:#a42d38}
.feedback{margin-top:18px;padding:15px 17px;border-radius:13px;line-height:1.45;font-weight:700;display:none}
.feedback.good{display:block;background:#e9f8f1;color:#126344}.feedback.bad{display:block;background:#fff0f0;color:#a42d38}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
button.primary,button.secondary{border:0;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:800;cursor:pointer}
.primary{background:#1464a5;color:white}.primary:hover{background:#0f4e82}.secondary{background:#eaf1f7;color:#24445e}
.result{text-align:center}.medal{font-size:64px;margin:8px}.bigscore{font-size:clamp(40px,8vw,66px);font-weight:900;color:#1464a5;margin:8px}
.hidden{display:none!important}.result p{color:#61788d;line-height:1.5}
@media(max-width:620px){.answers{grid-template-columns:1fr}.all{grid-column:auto}header{align-items:flex-start;flex-direction:column}.tag{text-align:left}}
</style>
</head>
<body>
<header><div class="brand">STELLANTIS <span>· RULETA LOGISTICA</span></div><div class="tag">DESAFÍO DE CONOCIMIENTOS · LOGÍSTICA</div></header>
<main>
<section id="home" class="panel">
<h1>¡Poné a prueba tus conocimientos!</h1>
<p class="sub">Elegí una categoría o jugá con todas las preguntas. Leé con atención y seleccioná una respuesta. ¡Sumá puntos y superá el desafío!</p>
<div id="categories" class="categories"></div>
</section>
<section id="game" class="panel hidden">
<div class="topline"><span id="category" class="pill"></span><span class="score" id="score">⭐ 0 puntos</span></div>
<div class="topline"><span id="counter" class="qnum"></span><span id="remaining" class="qnum"></span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="question" class="question"></div>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback"></div>
<div class="actions"><button class="secondary" onclick="goHome()">Salir al menú</button><button id="next" class="primary" disabled onclick="nextQuestion()">Siguiente pregunta →</button></div>
</section>
<section id="result" class="panel result hidden">
<div class="medal" id="medal">🏆</div><h1 id="resultTitle">¡Desafío completado!</h1>
<div class="bigscore" id="finalScore">0/0</div>
<p id="resultText"></p>
<div class="actions" style="justify-content:center"><button class="primary" onclick="startGame(currentCategory)">Volver a jugar</button><button class="secondary" onclick="goHome()">Elegir otra categoría</button></div>
</section>
</main>
<script>
const QUESTIONS = [{"n": 1, "category": "Seguridad", "question": "¿Qué elementos de protección personal son obligatorios en el área operativa?", "options": ["Chaleco, calzado de seguridad y EPP específico del área", "Solo guantes", "Solo chaleco", "No se requiere EPP el área Logistica"], "correct": "A"}, {"n": 2, "category": "Seguridad", "question": "¿Cómo se debe utilizar un cúter de forma segura?", "options": ["Cortando hacia el cuerpo", "Cortando en dirección contraria al cuerpo y manteniendo las manos fuera de la trayectoria", "Cortar rápidamente sin verificar la posición de las manos.", "Todas son incorrectas"], "correct": "B"}, {"n": 3, "category": "Seguridad", "question": "¿Qué riesgos existen en una zona hombre-máquina?", "options": ["Golpes, atropellamientos y atrapamientos", "Solo caída de objetos pequeños", "Ningún riesgo si hay circulación señalizada", "Únicamente riesgos ergonómicos por movimientos repetitivos."], "correct": "A"}, {"n": 4, "category": "Seguridad", "question": "Si un autoelevador ingresa a tu zona de trabajo, ¿qué debés hacer?", "options": ["Continuar trabajando sin prestarle atención", "Acercarte para indicarle el donde dejar el pallet", "Dirigirme a el área segura predispuesta en cada sector.", "Todas son correctas"], "correct": "C"}, {"n": 5, "category": "Seguridad", "question": "¿Qué se considera una zona segura?", "options": ["Cualquier espacio libre dentro del depósito", "Una zona habilitada, fuera de la circulación y maniobra de equipos", "El espacio detrás de un autoelevador", "La zona de carga aunque haya equipos maniobrando"], "correct": "B"}, {"n": 6, "category": "Seguridad", "question": "¿Qué riesgo genera un pallet mal estrichado?", "options": ["Ninguno si está apoyado en el piso", "Que la carga se desplace o caiga y provoque golpes o accidentes", "Puede provocar unicamente daño del material", "Una demora productiva"], "correct": "B"}, {"n": 7, "category": "Seguridad", "question": "¿Qué debés hacer si detectás una condición insegura?", "options": ["Continuar y avisar al finalizar el turno", "Moverla sin autorización", "Detener la tarea si existe peligro, resguardarte e informar al responsable", "Ignorarla si no hubo un accidente"], "correct": "C"}, {"n": 8, "category": "Aperturado", "question": "¿Cuántas pedanas corresponden por tipo de cajón?", "options": ["Las pedanas y los cajones no tienen relación entre si ", "Siempre dos", "La cantidad indicada en el estándar de aperturado correspondiente (Tres)", "La predispuesta en mi área de trabajo"], "correct": "C"}, {"n": 9, "category": "Aperturado", "question": "¿Qué elementos se deben utilizar para realizar el aperturado?", "options": ["Cualquier herramienta disponible", "Los elementos definidos en el estándar de trabajo", "Únicamente las manos", "Herramientas personales no autorizadas"], "correct": "B"}, {"n": 10, "category": "Aperturado", "question": "¿Qué se debe verificar antes de comenzar el aperturado?", "options": ["Solo que haya espacio libre asi se apertura", "Identificación, zona segura y elementos necesarios para realizar el apertura del mismo.", "Que el cajon venga en buenas condiciones para comenzar a aperturarlo", "Ninguna es correcta"], "correct": "B"}, {"n": 11, "category": "Aperturado", "question": "¿En cuantas áreas se divide el aperturado?", "options": ["Se divide en 4 sectores (MONTAJE,CHAPA,CALIDAD,CUENTA TRABAJO)", "No tiene sectorizacion por área", "Solo en 3 (MONTAJE,UDM,CUENTA TRABAJO)", "Solo en 2 (MONTAJE,CHAPA)"], "correct": "A"}, {"n": 12, "category": "Aperturado", "question": "¿Cómo se genera un bono?", "options": ["Se genera atraves de Armazém> Consulta>Reimpresión de bono ", "Se genera atraves de Armazém>Estoque por Cim> Consulta>Reimpresión de bono ", "Se genera atraves de Gestão de Armazém> Gestão de Lote> Gestão de Lote.​", "Ninguna es correcta"], "correct": "C"}, {"n": 13, "category": "Aperturado", "question": "¿El área del aperturado cuenta con zonas delimitadas ?", "options": ["Si esta dividido según el área que corresponda el aperturado", "No,se apertura en la zona que este disponible en el momento.", "Se apertura solo si se requiere de linea.", "Ninguna de las anteriores son correctas"], "correct": "A"}, {"n": 14, "category": "Críticos", "question": "¿Por qué medios se reciben los pedidos de materiales críticos?", "options": ["Únicamente por WhatsApp", "Por Excel y llamadas de línea (TD)", "Solo mediante Excel Compartido", "Solo por llamadas de linea (HOT)"], "correct": "B"}, {"n": 15, "category": "Críticos", "question": "¿Cómo se realiza la expedición de materiales críticos?", "options": ["Se realiza el MASTERCIM del pallet,procede a realizar la carga del porta y expedición al destino correspondiente", "Dejando el material en cualquier sector para que el porta proceda a llevarlo a el área que corresponde", "Entregándolo sin realizar ningun movimiento en el sistema ", "Se  realiza la carga en el porta y se lleva directamente a linea "], "correct": "A"}, {"n": 16, "category": "Críticos", "question": "¿Cuál es la altura máxima del pallet para expedición?", "options": ["100 cm", "120 cm", "140 cm", "180 cm"], "correct": "C"}, {"n": 17, "category": "Críticos", "question": "¿Qué se debe verificar antes de expedir un material crítico?", "options": ["Solo que este realizado el MASTERCIM y que no supere 140 cm el pallet.", "Identificación, cantidad, estado y destino al que corresponda con su cambio de ubicación realizada ", "El tamaño del pallet ", "Solo que el pallet bien strechado"], "correct": "B"}, {"n": 18, "category": "Recepción", "question": "¿Qué se debe controlar al recibir un camión?", "options": ["Solo la patente", "Ingreso, documentación, condiciones de seguridad y transporte según procedimiento", "Únicamente la cantidad de pallets", "Solo el horario de llegada"], "correct": "B"}, {"n": 19, "category": "Recepción", "question": "¿Qué es la sombra en recepción?", "options": ["Un lugar para guardar elementos personales", "Zona habilitada para descargar material, buscarlo y asignarle la ubicación correspondiente", "Un espacio de circulación de autoelevadores", "Un sector de residuos"], "correct": "B"}, {"n": 20, "category": "Recepción", "question": "¿Existe relación entre Recepción y Cuenta Trabajo?", "options": ["No, son procesos independientes", "Sí, se relacionan para gestionar materiales y su flujo", "Se relaciona solo cuando se tiene que expedir el material.", "Ninguna es correcta"], "correct": "B"}, {"n": 21, "category": "Recepción", "question": "¿Cómo se debe solicitar un contenedor?", "options": ["Le damos a Desova-Desova, colocamos el contenedor y confirmamos", "Completamos los datos desde consulta de disenho, y confirmamos desde la flecha verde", "Desde Desova, seleccionamos consulta de disenho y le damos a la flecha de Acoes", "desde consulta de disenho, colocamos el codigo de remito"], "correct": "B"}, {"n": 22, "category": "Recepción", "question": "¿Qué se debe controlar al descargar un contenedor?", "options": ["Solo que esté traiga el material correspondiente", "Identificación, cantidades, estado del material y condiciones seguras de descarga", "Únicamente el retiro de precinto", "Solo el estado en el que viene el contenedor"], "correct": "B"}, {"n": 23, "category": "Recepción", "question": "¿Qué se debe verificar al descargar un camión?", "options": ["Identificación, cantidades, estado del material y condiciones seguras", "Solo el orden de llegada", "Únicamente la documentación del chofer", "Que el chofer cumpla con los EPP"], "correct": "A"}, {"n": 24, "category": "Cuenta Trabajo", "question": "¿Por qué medios se reciben los pedidos de proveedores?", "options": ["Email y Excel compartido", "Solo llamadas telefónicas", "Únicamente de manera presencial", "Únicamente por WhatsApp"], "correct": "A"}, {"n": 25, "category": "Cuenta Trabajo", "question": "¿Cómo se realiza la expedición de Cuenta Trabajo?", "options": ["Mediante Logistics, en el área Expedición; luego se comunica el número de expedición al programador para generar los remitos", "Mediante una planilla de compartida", "Solo el programador realiza la expedición directamente", "Todas son correctas"], "correct": "A"}, {"n": 26, "category": "Cuenta Trabajo", "question": "¿Cómo se distribuyen los sectores de Cuenta Trabajo?", "options": ["De manera aleatoria", "Según la distribución establecida para cada proveedor", "No tiene un lugar definido ", "Según el espacio disponible del momento, sin criterio"], "correct": "B"}, {"n": 27, "category": "Cuenta Trabajo", "question": "¿Qué se debe hacer si un pedido llega incompleto?", "options": ["Completarlo con otro material sin dar aviso", "Informar el faltante por el canal correspondiente, dejando registro e identificación", "Cerrar el pedido como completo", "Ninguna es correcta"], "correct": "B"}, {"n": 28, "category": "Cuenta Trabajo", "question": "¿Qué se debe verificar al recibir un pedido?", "options": ["Solo el embalaje", "Cantidades y fecha de entrega predeterminada.", "Únicamente el nombre del chofer", "Solo el número de pallets"], "correct": "B"}, {"n": 29, "category": "Abassamento", "question": "¿Cuándo se genera un abassamento?", "options": ["Cuando se impacta una TD de línea, la cual al abastecerla se paga", "Cada vez que cambia el turno productivo se vuelve a generar", "Solo cuando lo solicita el destino", "Al finalizar el inventario del área"], "correct": "A"}, {"n": 30, "category": "Abassamento", "question": "¿Qué debés verificar antes de atender el bono de abassamento?", "options": ["Que el CIM coincida con el abassamento solicitado", "Solo que el pallet esté bien preparado", "Que la ubicación y diseño corresponda con la caja.", "Únicamente el diseño de caja coicida con el pedido"], "correct": "A"}, {"n": 31, "category": "Abassamento", "question": "¿Qué consecuencia puede tener no atender un bono a tiempo?", "options": ["Ninguna, porque el sistema lo cancela", "Parada de línea por falta de abastecimiento y pérdidas para Logística", "Solo una diferencia de inventario", "Únicamente una demora en recepción"], "correct": "B"}, {"n": 32, "category": "Abassamento", "question": "¿Qué significa FIFO?", "options": ["Final de inventario, final de operación", "Primero en ingresar, primero en salir", "Flujo interno de fabricación y operación", "Ficha de identificación de flujo operativo"], "correct": "B"}, {"n": 33, "category": "Abassamento", "question": "¿Cuál es el objetivo del FIFO?", "options": ["Retirar primero el material que llegó último", "Asegurar que el material que ingresó primero sea el primero en salir", "Ordenar los materiales por tamaño", "Priorizar siempre el material más cercano"], "correct": "B"}, {"n": 34, "category": "Abassamento", "question": "¿Cómo se respeta el FIFO en el proceso?", "options": ["El operador elige manualmente qué CIM retirar", "El sistema lo respeta automáticamente; el operador no selecciona manualmente el CIM", "Se retira siempre el pallet más nuevo", "No se aplica FIFO en el abastecimiento"], "correct": "B"}, {"n": 35, "category": "Abassamento", "question": "Si el CIM no coincide con el abassamento, ¿qué debés hacer?", "options": ["Atender el bono igual", "Detener la atención y verificar la diferencia antes de continuar", "Cambiar el CIM por cuenta propia", "Entregar otro material similar"], "correct": "B"}, {"n": 36, "category": "Sistema", "question": "¿Qué sistemas se utilizan actualmente en el proceso?", "options": ["CLICK ", "Logistics", "PMS", "Todas son correctas"], "correct": "D"}, {"n": 37, "category": "Sistema", "question": "¿Dónde se consulta un diseño?", "options": ["En Almacén y Estoque por CIM", "En Almacén y Estoque por MASTERCIM", "En Almacén y Estoque por desenho", "En Almacén y Estoque de envio"], "correct": "A"}, {"n": 38, "category": "Sistema", "question": "¿Se puede mover material sin romper el MasterCIM?", "options": ["Sí, cuando se mueve el MasterCIM completo", "No, nunca se puede mover material", "Sí, aunque se separen piezas del MasterCIM", "Solo si se elimina el CIM"], "correct": "A"}, {"n": 39, "category": "Sistema", "question": "¿Cómo se genera un MasterCIM?", "options": ["Almacén > Estoque por CIM > Consulta; leer todos los CIM y generar el MasterCIM", "Almacén > Estoque por MASTERCIM > Consulta; leer todos los CIM y generar el MasterCIM", "Almacén > Analisis de estoque", "Ninguna es correcta"], "correct": "A"}, {"n": 40, "category": "Sistema", "question": "¿Qué es un CIM?", "options": ["La identificación única que tiene cada caja como documento", "Es el numero de diseño de la caja.", "El número de lote del material recibido.", "El código de ubicación asignado al pallet."], "correct": "A"}, {"n": 41, "category": "Sistema", "question": "¿Qué significa rientro?", "options": ["Material que vuelve a ingresar al sistema", "Material que se envía a línea por primera vez", "Material dado de baja", "Material pendiente de recepción"], "correct": "A"}, {"n": 42, "category": "Sistema", "question": "¿Cómo se genera un rientro de una pieza?", "options": ["Almacén, causal 228", "Almacén, causal 626", "Almacén, causal 226", "Ninguna es correcta"], "correct": "C"}, {"n": 43, "category": "Sistema", "question": "¿Cómo se consulta el stock mediante Logistics?", "options": ["Almacén > Consulta, ingresando el diseño de la pieza", "Almacén > Consulta, ingresando el numero de Remito", "Almacén > Consulta, ingresando CIM", "Ninguna de las anteriores son correctas"], "correct": "A"}, {"n": 44, "category": "Sistema", "question": "¿Qué significa dar de baja un CIM en este proceso?", "options": ["Pagarlo a línea", "Reingresar un diseño al sistema ", "Generar un nuevo bono para el material.", "Cambiar la ubicación del material en la estantería."], "correct": "A"}];
const names = ["Seguridad","Aperturado","Críticos","Recepción","Cuenta Trabajo","Abassamento","Sistema"];
const classes = ["safety","aperturado","criticos","recepcion","cuenta","abassamento","sistema"];
const icons = ["🦺","📦","🚚","📋","🏭","🔄","💻"];
let deck=[], index=0, points=0, answered=false, currentCategory="Todas";
const $=id=>document.getElementById(id);
function renderCategories(){
 const box=$("categories");
 box.innerHTML=`<button class="cat all" onclick="startGame('Todas')"><strong>🎯 Todas las categorías</strong><small>Jugar con las ${QUESTIONS.length} preguntas</small></button>`;
 names.forEach((name,i)=>{
  const count=QUESTIONS.filter(q=>q.category===name).length;
  box.innerHTML+=`<button class="cat ${classes[i]}" onclick="startGame('${name.replace(/'/g,"\\'")}')"><strong>${icons[i]} ${name}</strong><small>${count} preguntas</small></button>`;
 });
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(category){
 currentCategory=category;
 deck=shuffle(QUESTIONS.filter(q=>category==="Todas"||q.category===category).slice());
 index=0;points=0;
 $("home").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");
 showQuestion();
}
function showQuestion(){
 answered=false;const q=deck[index];
 $("category").textContent=(q.category);$("score").textContent=`⭐ ${points} puntos`;
 $("counter").textContent=`PREGUNTA ${index+1} DE ${deck.length}`;
 $("remaining").textContent=`${deck.length-index} ${deck.length-index===1?"RESTANTE":"RESTANTES"}`;
 $("bar").style.width=`${index/deck.length*100}%`;
 $("question").textContent=q.question;
 $("feedback").className="feedback";$("feedback").textContent="";
 $("next").disabled=true;$("next").textContent=index===deck.length-1?"Ver resultado 🏁":"Siguiente pregunta →";
 $("answers").innerHTML="";
 q.options.forEach((opt,i)=>{
  const btn=document.createElement("button");btn.className="answer";
  btn.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${escapeHTML(opt)}`;
  btn.onclick=()=>chooseAnswer(i,btn);$("answers").appendChild(btn);
 });
}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function chooseAnswer(choice,btn){
 if(answered)return;answered=true;
 const q=deck[index], correct="ABCD".indexOf(q.correct);
 [...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add("correct");});
 if(choice===correct){points++;$("feedback").className="feedback good";$("feedback").textContent="¡Correcto! 🎉 ¡Muy bien!";} 
 else{$("feedback").className="feedback bad";$("feedback").textContent=`No es correcto. La respuesta correcta es ${q.correct}: ${q.options[correct]}`;btn.classList.add("wrong");}
 $("score").textContent=`⭐ ${points} puntos`;$("next").disabled=false;
}
function nextQuestion(){if(!answered)return;index++;if(index>=deck.length){showResult();return;}showQuestion();}
function showResult(){
 $("game").classList.add("hidden");$("result").classList.remove("hidden");
 const pct=Math.round(points/deck.length*100);
 $("finalScore").textContent=`${points}/${deck.length}`;
 $("medal").textContent=pct>=85?"🏆":pct>=60?"🥇":pct>=40?"👏":"💪";
 $("resultTitle").textContent=pct>=85?"¡Excelente trabajo!":pct>=60?"¡Muy buen resultado!":pct>=40?"¡Buen intento!":"¡A seguir practicando!";
 $("resultText").textContent=`Respondiste correctamente ${points} de ${deck.length} preguntas (${pct}%). ${pct>=85?"¡Tenés un gran dominio de los temas!":"Podés volver a jugar para reforzar los conocimientos."}`;
 $("bar").style.width="100%";
}
function goHome(){$("game").classList.add("hidden");$("result").classList.add("hidden");$("home").classList.remove("hidden");}
renderCategories();
</script>
</body></html>
